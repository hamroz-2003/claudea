# FlowCraft Studio — APK ni GitHub serverida avtomatik yig'ish.
# Natija: Actions → oxirgi ishga tushirish → "Artifacts" bo'limida APK fayllar.
# Release imzosi uchun (ixtiyoriy) repo Secrets: FC_KEYSTORE_BASE64, FC_KEYSTORE_PASSWORD, FC_KEY_ALIAS, FC_KEY_PASSWORD
name: FlowCraft Android APK

on:
  push:
    paths:
      - "FlowCraftStudio-Android/**"
      - ".github/workflows/flowcraft-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FlowCraftStudio-Android
    env:
      FC_KEYSTORE_BASE64: ${{ secrets.FC_KEYSTORE_BASE64 }}
      FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
      FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
      FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kesh
        uses: gradle/actions/setup-gradle@v4

      - name: Imzo kalitini tiklash (Secrets bo'lsa)
        if: env.FC_KEYSTORE_BASE64 != ''
        run: |
          echo "$FC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flowcraft.jks"
          echo "FC_KEYSTORE_FILE=$RUNNER_TEMP/flowcraft.jks" >> "$GITHUB_ENV"

      - name: APK yig'ish (debug + release)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: APK larni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: FlowCraft-Studio-apk
          path: FlowCraftStudio-Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
